services:
  gulfjobshub:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: gulfjobshub
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in the root .env file}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the root .env file}
      REQUIRE_MALWARE_SCAN: "true"
      CLAMSCAN_PATH: /usr/bin/clamscan
    ports:
      - "3000:3000"
    volumes:
      - gulfjobshub_data:/data

volumes:
  gulfjobshub_data:
