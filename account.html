<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | GulfJobsHub</title><link rel="stylesheet" href="site.css"><script defer src="account.js"></script></head><body><main class="container section" style="max-width:760px"><a href="index.html" class="text-link">← GulfJobsHub</a><h1>Join GulfJobsHub</h1><p>Create a secure job seeker or employer account.</p><div class="panel"><div class="button-row"><button class="btn btn-primary" id="showLogin">Sign in</button><button class="btn btn-outline" id="showRegister">Create account</button></div><form id="accountForm" class="form-grid" style="margin-top:20px"><div class="form-field full" id="nameWrap"><label for="name">Full name / contact name</label><input id="name" name="name" maxlength="100" autocomplete="name"></div><div class="form-field full"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="190" autocomplete="email"></div><div class="form-field full"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="10" autocomplete="current-password"><small>Use at least 10 characters.</small></div><div class="form-field full" id="roleWrap"><label for="role">Account type</label><select id="role" name="role"><option value="jobseeker">Job seeker</option><option value="employer">Employer</option></select></div><div class="form-field full"><button class="btn btn-primary" id="submitAccount">Sign in</button></div></form><div id="accountMessage" aria-live="polite"></div><p><a href="portal.html">Open my dashboard</a></p></div></main></body></html>
